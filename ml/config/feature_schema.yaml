version: "1.0.0"
description: "Statistical and temporal feature schema for edge and server ML models"

sampling_assumptions:
  nominal_sample_rate_hz: 2.0 # 500 ms sampling period on ESP32
  window_size_samples: 10     # 5.0 second rolling analysis window
  step_size_samples: 2        # 1.0 second stride for training instances

features:
  # Primary Gas Sensor 1: MQ-2 (Combustible / LPG / Smoke)
  - name: "mq2_raw_current"
    type: "float32"
    source: "MQ2"
    unit: "ADC_counts (0-4095)"
    description: "Most recent raw 12-bit ADC reading"
  - name: "mq2_mean"
    type: "float32"
    source: "MQ2"
    unit: "ADC_counts"
    description: "Mean ADC value over window"
  - name: "mq2_std"
    type: "float32"
    source: "MQ2"
    unit: "ADC_counts"
    description: "Standard deviation of ADC over window (captures turbulence/instability)"
  - name: "mq2_min"
    type: "float32"
    source: "MQ2"
    unit: "ADC_counts"
    description: "Minimum ADC over window"
  - name: "mq2_max"
    type: "float32"
    source: "MQ2"
    unit: "ADC_counts"
    description: "Maximum ADC over window"
  - name: "mq2_delta"
    type: "float32"
    source: "MQ2"
    unit: "ADC_counts"
    description: "Peak-to-trough range (max - min) in window"
  - name: "mq2_slope"
    type: "float32"
    source: "MQ2"
    unit: "ADC_counts/sec"
    description: "Linear rate of change across window (positive = gas influx, negative = venting)"

  # Primary Gas Sensor 2: MQ-135 (Hazardous gases / Air quality)
  - name: "mq135_raw_current"
    type: "float32"
    source: "MQ135"
    unit: "ADC_counts (0-4095)"
    description: "Most recent raw 12-bit ADC reading"
  - name: "mq135_mean"
    type: "float32"
    source: "MQ135"
    unit: "ADC_counts"
    description: "Mean ADC value over window"
  - name: "mq135_std"
    type: "float32"
    source: "MQ135"
    unit: "ADC_counts"
    description: "Standard deviation of ADC over window"
  - name: "mq135_min"
    type: "float32"
    source: "MQ135"
    unit: "ADC_counts"
    description: "Minimum ADC over window"
  - name: "mq135_max"
    type: "float32"
    source: "MQ135"
    unit: "ADC_counts"
    description: "Maximum ADC over window"
  - name: "mq135_delta"
    type: "float32"
    source: "MQ135"
    unit: "ADC_counts"
    description: "Peak-to-trough range in window"
  - name: "mq135_slope"
    type: "float32"
    source: "MQ135"
    unit: "ADC_counts/sec"
    description: "Linear rate of change across window"

  # Interaction Feature
  - name: "gas_ratio_mq2_to_mq135"
    type: "float32"
    source: "DERIVED"
    unit: "dimensionless"
    description: "Ratio of mq2_mean / (mq135_mean + 1e-4) to isolate selective chemical affinity"

missing_feature_policy:
  temperature: "Excluded from core hardware classification tensor if not present in training set"
  humidity: "Excluded from core hardware classification tensor if not present in training set"
  notes: "Temperature/humidity compensation will be applied as an environmental scaling modifier when DHT11 is active, rather than fabricating missing ambient values during training."

normalization:
  strategy: "StandardScaler (Z-score mean=0, std=1)"
  edge_target: "TFLite int8 full-integer quantization"
